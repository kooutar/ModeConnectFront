<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ModeConnectFront</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- global fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#7f13ec',
                hover: '#6810c1',
                soft: 'rgba(127, 19, 236, 0.1)',
                25: 'rgba(127, 19, 236, 0.25)',
                30: 'rgba(127, 19, 236, 0.3)',
              },
              text: {
                heading: '#0f172a',
                main: '#334155',
                muted: '#64748b',
              },
              background: {
                light: '#ffffff',
                soft: '#f8fafc',
              },
              surface: '#ffffff',
            },
            fontFamily: {
              display: ['Outfit', 'sans-serif'],
              body: ['Outfit', 'sans-serif'],
              sans: ['Outfit', 'sans-serif'],
            },
            borderRadius: { 
              DEFAULT: '0.5rem', 
              'lg': '0.75rem',
              'xl': '1rem', 
              '2xl': '1.5rem',
              'full': '9999px',
            },
            boxShadow: {
              'primary-sm': '0 10px 15px -3px rgba(127, 19, 236, 0.1)',
              'primary-md': '0 10px 20px rgba(127, 19, 236, 0.2)',
              'primary-lg': '0 20px 25px -5px rgba(127, 19, 236, 0.1), 0 10px 10px -5px rgba(127, 19, 236, 0.04)',
            }
          },
        },
      };
    </script>
    <style>
      :root {
        --primary: #7f13ec;
        --primary-hover: #6810c1;
        --primary-soft: rgba(127, 19, 236, 0.1);
        --text-heading: #0f172a;
        --text-main: #334155;
        --text-muted: #64748b;
        --bg-main: #ffffff;
        --bg-soft: #f8fafc;
        --font-family: 'Outfit', sans-serif;
      }
      body {
        font-family: var(--font-family);
        color: var(--text-main);
      }
    </style>
  </head>
  <body class="bg-background-light font-display text-text-main antialiased overflow-x-hidden">
    <app-root></app-root>
  </body>
</html>
